services:
  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: annoyingcap-backend
    environment:
      APP_ENV: development
      APP_NAME: Annoying Cap Core Backend
      APP_VERSION: 0.1.0
      API_PREFIX: /v1
      FRONTEND_APP_URL: http://127.0.0.1:3000
      DEBUG: "true"
      MIGRATE_ON_STARTUP: "true"
      SEED_ON_STARTUP: "true"
      DATABASE_URL: postgresql+psycopg://annoyingcap:annoyingcap@db:5432/annoyingcap
      NEWS_SUMMARIZER_DIR: /app/apps/summarizer
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-your-kakao-rest-api-key}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-your-kakao-client-secret}
      KAKAO_REDIRECT_URI: http://127.0.0.1:8000/v1/auth/oauth/kakao/callback
      JWT_SECRET_KEY: annoyingcap-dev-jwt-secret-key-32chars
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=2)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: postgres:16-alpine
    container_name: annoyingcap-postgres
    environment:
      POSTGRES_DB: annoyingcap
      POSTGRES_USER: annoyingcap
      POSTGRES_PASSWORD: annoyingcap
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annoyingcap -d annoyingcap"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
