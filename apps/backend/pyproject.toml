[project]
name = "annoying-cap-core-backend"
version = "0.1.0"
description = "Annoying Cap core backend built with FastAPI, DDD, and layered architecture"
requires-python = ">=3.11"
dependencies = [
    'fastapi>=0.115,<0.116',
    'uvicorn[standard]>=0.32,<1',
    'httpx>=0.28,<0.29',
    'sqlalchemy>=2,<3',
    'psycopg[binary]>=3.2,<4',
    'pydantic-settings>=2.6,<3',
    'alembic>=1.13,<2',
    'PyJWT>=2.8,<3',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.3,<9',
]
