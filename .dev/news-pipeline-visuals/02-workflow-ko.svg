<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
  <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
  <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/></marker>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
  .bg{fill:#020617}.grid{fill:url(#grid)}
  .title{font:800 34px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;fill:#f8fafc;letter-spacing:-.6px}
  .subtitle{font:600 16px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;fill:#94a3b8}
  .section{font:800 18px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;fill:#e2e8f0}
  .note{font:600 12px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;fill:#94a3b8}
  .boxTitle{font:800 17px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;fill:#f8fafc}
  .boxText{font:600 13px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;fill:#cbd5e1}
  .boxSmall{font:600 11px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;fill:#94a3b8}
  .mono{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#a5f3fc}
  .tagText{font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#020617}
  .lane{fill:rgba(15,23,42,.55);stroke:#334155;stroke-width:1.4;rx:20}
  .external{fill:rgba(30,41,59,.60);stroke:#94a3b8;stroke-width:1.8;rx:13}
  .cloud{fill:rgba(120,53,15,.30);stroke:#fbbf24;stroke-width:1.8;rx:13}
  .artifact{fill:rgba(251,146,60,.26);stroke:#fb923c;stroke-width:1.8;rx:13}
  .ai{fill:rgba(8,51,68,.44);stroke:#22d3ee;stroke-width:1.8;rx:13}
  .backend{fill:rgba(6,78,59,.40);stroke:#34d399;stroke-width:1.8;rx:13}
  .db{fill:rgba(76,29,149,.40);stroke:#a78bfa;stroke-width:1.8;rx:13}
  .gate{fill:rgba(136,19,55,.38);stroke:#fb7185;stroke-width:1.8;rx:13}
  .arrow{stroke:#94a3b8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  .cyanArrow{stroke:#22d3ee;stroke-width:2.7;fill:none;marker-end:url(#arrowCyan)}
  .greenArrow{stroke:#34d399;stroke-width:2.7;fill:none;marker-end:url(#arrowGreen)}
  .amberArrow{stroke:#fbbf24;stroke-width:2.7;fill:none;marker-end:url(#arrowAmber)}
  .roseArrow{stroke:#fb7185;stroke-width:2.5;fill:none;marker-end:url(#arrowRose)}
  .dash{stroke-dasharray:8 7}.thin{stroke-width:1.6}.ok{fill:#34d399}.cyan{fill:#22d3ee}.amber{fill:#fbbf24}.rose{fill:#fb7185}.violet{fill:#a78bfa}.orange{fill:#fb923c}
</style>
</defs>
<rect width="1600" height="980" class="bg"/><rect width="1600" height="980" class="grid" opacity=".55"/>
<circle cx="56" cy="54" r="9" class="ok" filter="url(#glow)"/><text x="78" y="65" class="title">Cut News 운영 워크플로우</text>
<text x="80" y="94" class="subtitle">매일 실행되는 작업 순서와 실패 감지 지점을 한 장으로 정리</text>
<rect x="78" y="170" width="230" height="96" class="cloud"/>
<text x="100" y="201" class="boxTitle">① 기사 수집</text>
<text x="100" y="225" class="boxText">GitHub Actions 또는 fresh crawl</text>
<text x="100" y="245" class="boxSmall">NEWS_SOURCE=naver-all-categories</text>
<rect x="370" y="170" width="230" height="96" class="artifact"/>
<text x="392" y="201" class="boxTitle">② 아티팩트 확보</text>
<text x="392" y="225" class="boxText">latest.json 다운로드</text>
<text x="392" y="245" class="boxSmall">crawl_report 포함</text>
<rect x="662" y="170" width="230" height="96" class="artifact"/>
<text x="684" y="201" class="boxTitle">③ Raw Export</text>
<text x="684" y="225" class="boxText">raw/json/scored 정리</text>
<text x="684" y="245" class="boxSmall">이전 파생 산출물 clear</text>
<rect x="954" y="170" width="230" height="96" class="ai"/>
<text x="976" y="201" class="boxTitle">④ LLM 처리 시작</text>
<text x="976" y="225" class="boxText">Hermes profile 사용</text>
<text x="976" y="245" class="boxSmall">cut-news-pipeline</text>
<rect x="1246" y="170" width="260" height="96" class="ai"/>
<text x="1268" y="201" class="boxTitle">⑤ 후보 선별/요약</text>
<text x="1268" y="225" class="boxText">top-K + best-of-N</text>
<text x="1268" y="245" class="boxSmall">selected_per_category=3</text>
<line x1="308" y1="218" x2="368" y2="218" class="amberArrow"/><line x1="600" y1="218" x2="660" y2="218" class="amberArrow"/><line x1="892" y1="218" x2="952" y2="218" class="cyanArrow"/><line x1="1184" y1="218" x2="1244" y2="218" class="cyanArrow"/>
<rect x="1246" y="340" width="260" height="96" class="gate"/>
<text x="1268" y="371" class="boxTitle">⑥ Verifier 통과?</text>
<text x="1268" y="395" class="boxText">verdict=clean 확인</text>
<text x="1268" y="415" class="boxSmall">환각·길이·의미 검증</text>
<rect x="954" y="340" width="230" height="96" class="gate"/>
<text x="976" y="371" class="boxTitle">⑦ 분류 확정</text>
<text x="976" y="395" class="boxText">editorial category 우선</text>
<text x="976" y="415" class="boxSmall">fallback: source/crawler/keyword</text>
<rect x="662" y="340" width="230" height="96" class="backend"/>
<text x="684" y="371" class="boxTitle">⑧ Backend Import</text>
<text x="684" y="395" class="boxText">clean 기사만 저장</text>
<text x="684" y="415" class="boxSmall">insert/update/drop 집계</text>
<rect x="370" y="340" width="230" height="96" class="backend"/>
<text x="392" y="371" class="boxTitle">⑨ Snapshot 생성</text>
<text x="392" y="395" class="boxText">온보딩 사용자별 피드</text>
<text x="392" y="415" class="boxSmall">feed_date=KST 오늘</text>
<rect x="78" y="340" width="230" height="96" class="backend"/>
<text x="100" y="371" class="boxTitle">⑩ API 반영</text>
<text x="100" y="395" class="boxText">홈 피드·아카이브 제공</text>
<text x="100" y="415" class="boxSmall">snapshot_id로 읽음 기록</text>
<line x1="1376" y1="266" x2="1376" y2="338" class="roseArrow"/><line x1="1246" y1="388" x2="1186" y2="388" class="greenArrow"/><line x1="954" y1="388" x2="894" y2="388" class="greenArrow"/><line x1="662" y1="388" x2="602" y2="388" class="greenArrow"/><line x1="370" y1="388" x2="310" y2="388" class="greenArrow"/>
<rect x="78" y="520" width="1428" height="146" rx="20" fill="rgba(15,23,42,.72)" stroke="#334155"/>
<text x="110" y="556" class="section">운영 Gate</text>
<text x="110" y="586" class="boxText">make local-report-check REPORT_CHECK_ARGS=--require-uncapped</text>
<text x="110" y="614" class="boxSmall">확인: status=success · failed_step=null · max_articles=null · usable_imports&gt;0</text>
<text x="110" y="638" class="boxSmall">drop_reason_counts={} · quality_warnings=[]</text>
<text x="110" y="660" class="boxSmall">실패 시: stdout/stderr tail + run_report.json 기준으로 alert, DB import/snapshot 확인</text>
<line x1="1376" y1="436" x2="1376" y2="518" class="roseArrow dash"/>
<rect x="78" y="720" width="330" height="120" class="db"/>
<text x="100" y="751" class="boxTitle">산출물</text>
<text x="100" y="775" class="boxText">run_report.json</text>
<text x="100" y="795" class="boxSmall">run_reports/run_YYYYMMDD...</text>
<text x="100" y="813" class="boxSmall">summary_selection.json</text>
<rect x="462" y="720" width="330" height="120" class="ai"/>
<text x="484" y="751" class="boxTitle">현재 기본 LLM</text>
<text x="484" y="775" class="boxText">Hermes + openai-codex</text>
<text x="484" y="795" class="boxSmall">gpt-5.5 / reasoning medium</text>
<text x="484" y="813" class="boxSmall">PIPELINE_MAX_WORKERS=3</text>
<rect x="846" y="720" width="330" height="120" class="backend"/>
<text x="868" y="751" class="boxTitle">제품 반영</text>
<text x="868" y="775" class="boxText">DailyFeedSnapshot</text>
<text x="868" y="795" class="boxSmall">/v1/me/feed</text>
<text x="868" y="813" class="boxSmall">/v1/me/archive/YYYY-MM-DD</text>
<rect x="1230" y="720" width="276" height="120" class="gate"/>
<text x="1252" y="751" class="boxTitle">최근 증거</text>
<text x="1252" y="775" class="boxText">10/10 clean</text>
<text x="1252" y="795" class="boxSmall">classification=editorial 10/10</text>
<text x="1252" y="813" class="boxSmall">drop_reason_counts={{}}</text>
</svg>